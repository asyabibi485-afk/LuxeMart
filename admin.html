<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LuxeMart Admin</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><div class="nav wrap"><a class="logo" href="index.html">Luxe<span>Mart</span></a><a href="index.html">← Store</a></div></header>
<div id="login" class="adminLogin"><p class="eyebrow">PRIVATE AREA</p><h1>Admin Login</h1><form id="loginForm"><input id="email" type="email" required placeholder="Admin email"><input id="password" type="password" required placeholder="Password"><button class="btn full">Sign in</button></form><p id="loginMsg" class="msg"></p></div>
<div id="dashboard" class="adminWrap hidden"><div class="adminTop"><div><p class="eyebrow">LUXEMART ADMIN</p><h1>Dashboard</h1></div><button class="btn" id="logout">Sign out</button></div>
<div class="panel"><h2>Product manager</h2><form id="productForm" class="adminForm"><input name="name" required placeholder="Product name"><input name="price" required type="number" min="0" placeholder="Price (Rs)"><select name="category"><option>Clothes</option><option>Home</option></select><input name="image_url" placeholder="Image URL (optional)"><textarea name="description" placeholder="Description"></textarea><button class="btn" type="submit">Add product</button></form><div class="tableWrap"><table class="table"><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Action</th></tr></thead><tbody id="productRows"></tbody></table></div></div>
<div class="panel"><h2>Customer orders</h2><div class="tableWrap"><table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th>Date</th></tr></thead><tbody id="orderRows"></tbody></table></div></div></div>
<script src="config.js"></script><script src="admin.js"></script></body></html>
